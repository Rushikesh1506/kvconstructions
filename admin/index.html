<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — KV Constructions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111; color: #eee; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #d4a746; margin-bottom: 20px; font-size: 24px; }
    .token-box { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .token-box input { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #eee; border-radius: 4px; font-size: 14px; margin-bottom: 10px; }
    input, textarea, select { width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: #eee; border-radius: 4px; font-size: 14px; }
    label { display: block; margin-top: 12px; margin-bottom: 4px; color: #aaa; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-primary { background: #d4a746; color: #111; }
    .btn-primary:hover { background: #e0b556; }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn-secondary { background: #333; color: #eee; margin-right: 8px; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .project-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .project-card h3 { color: #d4a746; margin-bottom: 6px; }
    .project-card p { color: #999; font-size: 13px; margin-bottom: 8px; }
    .project-card .actions { display: flex; gap: 8px; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 24px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
    .modal h2 { color: #d4a746; margin-bottom: 16px; }
    .modal .form-actions { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; }
    .photo-upload-row { display: flex; gap: 8px; margin-top: 8px; }
    .photo-upload-row input { flex: 1; }
    .photo-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .photo-list img { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
    .photo-list img:hover { border-color: #d4a746; }
    .photo-item { position: relative; }
    .photo-item .remove-photo { position: absolute; top: -6px; right: -6px; background: #c0392b; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; line-height: 20px; text-align: center; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #27ae60; color: #fff; padding: 12px 20px; border-radius: 6px; font-size: 14px; z-index: 200; display: none; }
    .toast.error { background: #c0392b; }
    .toast.show { display: block; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .status-Completed { background: #27ae60; color: #fff; }
    .status-Ongoing { background: #d4a746; color: #111; }
    .status-Upcoming { background: #2980b9; color: #fff; }
    .empty-state { text-align: center; padding: 40px; color: #666; }
    .logout-link { float: right; color: #666; cursor: pointer; font-size: 13px; text-decoration: underline; }
    .logout-link:hover { color: #c0392b; }
    .photo-input-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .photo-input-row input { flex: 1; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div id="login-view">
      <h1>KV Constructions — Admin</h1>
      <div class="token-box">
        <p style="margin-bottom: 12px; color: #999; font-size: 14px;">Enter your GitHub personal access token to manage projects.</p>
        <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
        <button class="btn btn-primary" onclick="login()">Login</button>
        <p style="margin-top: 12px; font-size: 12px; color: #666;">
          Need a token? Go to <a href="https://github.com/settings/tokens" target="_blank" style="color: #d4a746;">GitHub Settings → Tokens</a>,
          create a classic token with <strong>repo</strong> scope.
        </p>
      </div>
    </div>

    <div id="admin-view" style="display:none">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h1 style="margin-bottom:0;">Projects</h1>
        <div>
          <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add Project</button>
          <span class="logout-link" onclick="logout()">Logout</span>
        </div>
      </div>
      <div id="project-list"></div>
      <div id="empty-state" class="empty-state" style="display:none">No projects yet. Click "Add Project" to create one.</div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Add Project</h2>
      <form id="project-form" onsubmit="saveProject(event)">
        <input type="hidden" id="edit-index" value="-1">
        <label>Title</label>
        <input type="text" id="p-title" required>
        <label>Location</label>
        <input type="text" id="p-location" required>
        <label>Description</label>
        <textarea id="p-description" rows="3" style="resize:vertical"></textarea>
        <label>Value (INR)</label>
        <input type="text" id="p-value" placeholder="e.g. ₹1.2 Crore">
        <label>Status</label>
        <select id="p-status">
          <option value="Completed">Completed</option>
          <option value="Ongoing">Ongoing</option>
          <option value="Upcoming">Upcoming</option>
        </select>
        <label>Photos (URLs)</label>
        <div id="photo-list"></div>
        <div class="photo-input-row">
          <input type="text" id="photo-url-input" placeholder="https://example.com/photo.jpg">
          <button type="button" class="btn btn-secondary btn-sm" onclick="addPhotoUrl()">Add</button>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const TOKEN_KEY = 'kv_admin_token';
    const REPO = 'Rushikesh1506/kvconstructions';
    const FILE_PATH = 'content/projects.json';
    const BRANCH = 'main';
    let projects = [];
    let currentSha = null;
    let photoUrls = [];

    function $(id) { return document.getElementById(id); }

    function login() {
      const token = $('token-input').value.trim();
      if (!token) return showToast('Enter a token', 'error');
      localStorage.setItem(TOKEN_KEY, token);
      loadProjects();
    }

    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      $('login-view').style.display = 'block';
      $('admin-view').style.display = 'none';
    }

    function showToast(msg, type) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'toast show' + (type === 'error' ? ' error' : '');
      setTimeout(() => t.className = 'toast', 3000);
    }

    async function githubAPI(method, path, body) {
      const token = localStorage.getItem(TOKEN_KEY);
      const opts = {
        method,
        headers: {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github.v3+json',
        }
      };
      if (body) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const res = await fetch('https://api.github.com' + path, opts);
      if (!res.ok) {
        const err = await res.text();
        throw new Error(err.substring(0, 200));
      }
      return res.status === 204 ? null : await res.json();
    }

    async function loadProjects() {
      try {
        $('login-view').style.display = 'none';
        $('admin-view').style.display = 'block';
        const data = await githubAPI('GET', '/repos/' + REPO + '/contents/' + FILE_PATH + '?ref=' + BRANCH);
        currentSha = data.sha;
        const content = atob(data.content);
        projects = JSON.parse(content).list || [];
        renderProjects();
      } catch (e) {
        showToast('Failed to load: ' + e.message, 'error');
        if (e.message.includes('401') || e.message.includes('403')) {
          logout();
        }
      }
    }

    function renderProjects() {
      const list = $('project-list');
      const empty = $('empty-state');
      if (projects.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      list.innerHTML = projects.map((p, i) => `
        <div class="project-card">
          <h3>${esc(p.title)}</h3>
          <p>📍 ${esc(p.location)} &nbsp;·&nbsp; <span class="status-badge status-${esc(p.status)}">${esc(p.status)}</span>${p.value ? ' &nbsp;·&nbsp; 💰 ' + esc(p.value) : ''}</p>
          <p>${esc(p.description || '').substring(0, 120)}${(p.description||'').length > 120 ? '...' : ''}</p>
          <div class="actions">
            <button class="btn btn-secondary btn-sm" onclick="openEditModal(${i})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteProject(${i})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function openAddModal() {
      $('modal-title').textContent = 'Add Project';
      $('edit-index').value = -1;
      $('p-title').value = '';
      $('p-location').value = '';
      $('p-description').value = '';
      $('p-value').value = '';
      $('p-status').value = 'Completed';
      photoUrls = [];
      renderPhotoList();
      $('modal').classList.add('active');
    }

    function openEditModal(idx) {
      const p = projects[idx];
      $('modal-title').textContent = 'Edit Project';
      $('edit-index').value = idx;
      $('p-title').value = p.title;
      $('p-location').value = p.location;
      $('p-description').value = p.description || '';
      $('p-value').value = p.value || '';
      $('p-status').value = p.status || 'Completed';
      photoUrls = (p.photos || []).map(u => typeof u === 'string' ? u : u.photo);
      renderPhotoList();
      $('modal').classList.add('active');
    }

    function closeModal() {
      $('modal').classList.remove('active');
    }

    function addPhotoUrl() {
      const url = $('photo-url-input').value.trim();
      if (!url) return;
      photoUrls.push(url);
      $('photo-url-input').value = '';
      renderPhotoList();
    }

    function removePhoto(idx) {
      photoUrls.splice(idx, 1);
      renderPhotoList();
    }

    function renderPhotoList() {
      const container = $('photo-list');
      if (photoUrls.length === 0) {
        container.innerHTML = '<p style="color:#666;font-size:13px;">No photos added yet.</p>';
        return;
      }
      container.innerHTML = photoUrls.map((url, i) => `
        <div class="photo-item">
          <img src="${esc(url)}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 60%22><rect fill=%22%23333%22 width=%22100%22 height=%2260%22/><text x=%2250%22 y=%2235%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2212%22>Error</text></svg>'">
          <button class="remove-photo" onclick="removePhoto(${i})">✕</button>
        </div>
      `).join('');
    }

    async function saveProject(e) {
      e.preventDefault();
      const idx = parseInt($('edit-index').value);
      const project = {
        title: $('p-title').value.trim(),
        location: $('p-location').value.trim(),
        description: $('p-description').value.trim(),
        value: $('p-value').value.trim(),
        status: $('p-status').value,
        photos: photoUrls.map(url => url)
      };

      try {
        if (idx === -1) {
          projects.push(project);
        } else {
          projects[idx] = project;
        }

        const content = btoa(unescape(encodeURIComponent(JSON.stringify({ list: projects }, null, 2))));
        await githubAPI('PUT', '/repos/' + REPO + '/contents/' + FILE_PATH, {
          message: idx === -1 ? 'Add project: ' + project.title : 'Update project: ' + project.title,
          content: content,
          sha: currentSha,
          branch: BRANCH
        });

        showToast('Saved! Deploying...');
        closeModal();
        await loadProjects();
      } catch (e) {
        showToast('Save failed: ' + e.message, 'error');
      }
    }

    async function deleteProject(idx) {
      if (!confirm('Delete "' + projects[idx].title + '"?')) return;
      try {
        projects.splice(idx, 1);
        const content = btoa(unescape(encodeURIComponent(JSON.stringify({ list: projects }, null, 2))));
        await githubAPI('PUT', '/repos/' + REPO + '/contents/' + FILE_PATH, {
          message: 'Delete project',
          content: content,
          sha: currentSha,
          branch: BRANCH
        });
        showToast('Deleted!');
        await loadProjects();
      } catch (e) {
        showToast('Delete failed: ' + e.message, 'error');
      }
    }

    const token = localStorage.getItem(TOKEN_KEY);
    if (token) {
      loadProjects();
    }
  </script>
</body>
</html>
